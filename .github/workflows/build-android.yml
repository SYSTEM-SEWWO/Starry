# 星语 Starry · Android APK 自动构建与发布
#
# 触发：推送形如 v* 的 tag（例如 v11.0.0）
# 行为：在 GitHub 运行器上用 Briefcase 0.4.7（Chaquopy + Gradle）真实编译
#       Python 核心 → 产出「已签名、可直接侧载安装」的 APK，并自动发布到
#       当前仓库的 Releases（即「像 GitHub Releases 一样好用」）。
#
# 关键修正（相对旧版）：
#   1) 固定 briefcase==0.4.7，且其模板要求 compileSdk/build-tools 36，故安装
#      platforms;android-36 与 build-tools;36.0.0（旧版的 android-34 会编译失败）。
#   2) briefcase package android 产出的是【未签名】release APK，无法直接安装；
#      故本流程显式用 zipalign + apksigner 自签名，确保发布的 APK 可安装。
#   3) 若仓库配置了密钥库 secret（ANDROID_KEYSTORE_BASE64 / ANDROID_KEY_ALIAS /
#      ANDROID_KEYSTORE_PASS / ANDROID_KEY_PASS），则用它签名；否则生成演示用
#      自签名密钥库（仅用于侧载测试，上架 Play 请替换为自有发布密钥）。
#
# 本地等价命令见 android/README.md 与 scripts/build_android_apk.sh。
name: Build Android APK

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

# v12.0：同一 tag 会并行触发 APK / EXE / Release 三个 workflow，
# 用 concurrency 串行化，避免多个 job 同时写同一个 GitHub Release。
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  ANDROID_HOME: ${{ github.workspace }}/android-sdk
  JAVA_HOME: ""  # 由 setup-java 注入

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/**/*.gradle') }}

      - name: Install Android SDK (cmdline-tools)
        run: |
          sudo apt-get update && sudo apt-get install -y unzip curl
          mkdir -p $ANDROID_HOME/cmdline-tools
          curl -fsSL -o cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q cmdtools.zip -d $ANDROID_HOME/cmdline-tools
          mv $ANDROID_HOME/cmdline-tools/cmdline-tools $ANDROID_HOME/cmdline-tools/latest
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          yes | sdkmanager --sdk_root=$ANDROID_HOME --licenses >/dev/null 2>&1 || true
          sdkmanager --sdk_root=$ANDROID_HOME "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;25.1.8937393"

      - name: Install Briefcase (pinned)
        run: pip install "briefcase==0.4.7"

      - name: Create & Build APK
        working-directory: android
        run: |
          briefcase create android
          briefcase build  android

      - name: Prepare signing keystore
        working-directory: android
        run: |
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > starry-release.keystore
            echo "Using repository-provided keystore."
          else
            echo "No keystore secret found; generating demo self-signed keystore."
            keytool -genkey -v -keystore starry-release.keystore \
              -alias starry -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass starrypass -keypass starrypass \
              -dname "CN=Starry, OU=Starry, O=Starry, L=CN, S=CN, C=CN"
          fi

      - name: Package (unsigned) + align + sign
        id: sign
        working-directory: android
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS || 'starrypass' }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASS || 'starrypass' }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || 'starry' }}
        run: |
          briefcase package android -p apk
          UNSIGNED=$(find dist -name "*.apk" | head -n1)
          echo "Unsigned APK: $UNSIGNED"
          BUILD_TOOLS=$ANDROID_HOME/build-tools/36.0.0
          ALIGNED=/tmp/starry-aligned.apk
          $BUILD_TOOLS/zipalign -p 4 "$UNSIGNED" "$ALIGNED"
          $BUILD_TOOLS/apksigner sign \
            --ks starry-release.keystore \
            --ks-key-alias "$KS_ALIAS" \
            --ks-pass pass:"$KS_PASS" \
            --key-pass pass:"$KEY_PASS" \
            --out "$UNSIGNED" "$ALIGNED"
          $BUILD_TOOLS/apksigner verify "$UNSIGNED" && echo "SIGN_VERIFY_OK"
          # 重命名为稳定文件名，便于 Release 下载
          SIGNED="星语Starry-Android-${{ github.ref_name }}.apk"
          cp "$UNSIGNED" "../$SIGNED"
          echo "signed_apk=$SIGNED" >> $GITHUB_OUTPUT
          echo "Signed APK: $SIGNED"

      - name: APK 静态鉴定（v12.0 新增门禁）
        run: |
          python scripts/verify_apk.py \
            --apk "星语Starry-Android-${{ github.ref_name }}.apk" \
            --expect-version "${GITHUB_REF_NAME#v}" \
            --strict

      - name: Release to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: 星语Starry-Android-${{ github.ref_name }}.apk
          append_body: true
          body: |
            ## 星语 Starry ${{ github.ref_name }} · Android APK（已签名，可侧载安装）

            - 原生安卓应用（BeeWare / Toga 封装，Briefcase 0.4.7 构建）
            - 复用桌面版纯 Python 核心：深度思考可视化 / 长期记忆 / 智能体工具
            - 已用 v2/v3 签名方案签名，手机允许「未知来源 / 安装未知应用」后点击 APK 即可安装
            - 包名：`com.starry.starryandroid`，版本：`${{ github.ref_name }}`

            > 如需上架 Google Play，请使用自有发布密钥替换签名（见 android/README.md）。

            详见仓库 `android/` 目录与 `android/README.md`。
