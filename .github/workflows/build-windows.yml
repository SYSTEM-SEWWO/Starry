# 星语 Starry · Windows EXE 自动构建与发布（V11.5 新增）
#
# 触发：推送形如 v* 的 tag（例如 v13.1.0）或手动 workflow_dispatch。
# 行为：在 GitHub 的 windows-latest 运行器上用 PyInstaller 真实编译出
#       两份单文件 exe —— CLI 版（starry_cli.spec）与 GUI 桌面版
#       （starrystar.spec，console=False），各自冒烟自检后上传 Artifact，
#       并【追加资产】到 GitHub Releases —— 至此「打包成点 exe」
#       与「像 GitHub Releases 一样好用」在多端闭环。
# v13.1：GUI EXE 用 main.py --selftest --out r.json 落盘自检结果，
#       由 scripts/smoke_gui_exe.py 读取判定，解决窗口程序无 stdout 的问题。
#
# 与 build-android.yml 的关系：
#   两个 workflow 会因同一个 tag 并行触发。本流程只「追加」Release 资产
#   （append_body、不设 name），绝不覆盖安卓侧创建的 Release 标题与说明。
#
# 关键修正（V11.5 实测）：
#   Windows 控制台默认编码 cp1252/GBK 无法编码部分中文，直接 print 会让
#   exe 秒退（UnicodeEncodeError）。已在 starry_cli.py 入口与 core.cli._emit
#   双层兜底，故此处自检可稳定通过。
name: Build Windows EXE

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

# v12.0：与 build-android.yml / release.yml 共用同一个 tag，
# 串行化避免并发写 Release 造成资产或说明被覆盖。
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-cli-exe:
    name: 打包 Windows 单文件 exe
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 安装依赖 + PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "pyinstaller==6.22.3"

      - name: PyInstaller 打包（starry_cli.spec）
        run: python -m PyInstaller starry_cli.spec --noconfirm --clean

      - name: 自检 exe（--version / --platform）
        shell: pwsh
        run: |
          chcp 65001 | Out-Null
          $env:PYTHONIOENCODING = "utf-8"
          $exe = "dist\星语Starry-CLI.exe"
          if (-not (Test-Path $exe)) { throw "exe 未生成: $exe" }
          & $exe --version
          if ($LASTEXITCODE -ne 0) { throw "--version 退出码 $LASTEXITCODE" }
          & $exe --platform
          if ($LASTEXITCODE -ne 0) { throw "--platform 退出码 $LASTEXITCODE" }
          & $exe --hub
          if ($LASTEXITCODE -ne 0) { throw "--hub 退出码 $LASTEXITCODE" }
          Write-Host "EXE_SMOKE_OK"

      - name: 整理发布包
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "dist\星语Starry-CLI-Win" | Out-Null
          Copy-Item "dist\星语Starry-CLI.exe" "dist\星语Starry-CLI-Win\"
          Copy-Item "README.md" "dist\星语Starry-CLI-Win\"
          Copy-Item "命令行使用指南.md" "dist\星语Starry-CLI-Win\" -ErrorAction SilentlyContinue
          Copy-Item "docs\Windows_EXE_构建指南.md" "dist\星语Starry-CLI-Win\" -ErrorAction SilentlyContinue

      - name: 上传产物（Actions Artifact）
        uses: actions/upload-artifact@v4
        with:
          name: starry-windows-cli-exe
          path: dist/星语Starry-CLI-Win/*
          if-no-files-found: error
          retention-days: 30

  build-gui-exe:
    name: 打包 Windows GUI 桌面版 exe
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 安装依赖 + PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "pyinstaller==6.22.3"

      - name: PyInstaller 打包（starrystar.spec，console=False）
        run: python -m PyInstaller starrystar.spec --noconfirm --clean

      - name: GUI EXE 自检（--version / --selftest 落盘判定）
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          $env:PYTHONUTF8 = "1"
          $exe = "dist\星语Starry.exe"
          if (-not (Test-Path $exe)) { throw "GUI exe 未生成: $exe" }
          python scripts/smoke_gui_exe.py --exe $exe
          if ($LASTEXITCODE -ne 0) { throw "GUI EXE 自检失败" }

      - name: 上传产物（Actions Artifact）
        uses: actions/upload-artifact@v4
        with:
          name: starry-windows-gui-exe
          path: dist/星语Starry.exe
          if-no-files-found: error
          retention-days: 30

  release:
    name: 追加 exe 到 GitHub Releases
    needs: [build-cli-exe, build-gui-exe]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: 下载构建产物（CLI）
        uses: actions/download-artifact@v4
        with:
          name: starry-windows-cli-exe
          path: release-assets

      - name: 下载构建产物（GUI）
        uses: actions/download-artifact@v4
        with:
          name: starry-windows-gui-exe
          path: release-assets

      - name: 发布到 Releases（只追加资产，不覆盖标题）
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/星语Starry-CLI.exe
            release-assets/星语Starry.exe
          append_body: true
          fail_on_unmatched_files: true
          body: |
            ## 🪟 Windows EXE · 星语 Starry ${{ github.ref_name }}

            - `星语Starry-CLI.exe`：单文件命令行版，Windows 10/11 x64 免安装直接运行
            - `星语Starry.exe`：**GUI 桌面版**（console=False，双击即用，托盘常驻）
            - CLI 已通过 `--version` / `--platform` / `--hub` 冒烟自检
            - GUI 已通过 `--version` / `--selftest` 落盘自检（含 Skills Hub 与工作台 offscreen 装配）
            - v13.1 起两个 exe 都内嵌 `skills/`，开箱即可 `--hub` 或打开 Skills Hub
            - 中文控制台编码已做双层兜底（cp1252 / GBK 环境不会因输出中文而秒退）

            > GUI 自检：`星语Starry.exe --selftest --out result.json`（结果落到 result.json）。
            > 本地一键构建见 `docs/Windows_EXE_构建指南.md` 与 `scripts/build_windows_cli.ps1`。
